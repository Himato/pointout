name: Bug
description: Something broke.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Steps, or better, a tiny repo.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: '@pointout/core 0.1.0, @pointout/angular 0.1.0, Angular 22, Chrome 140'
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Console errors, screenshots, the exported brief.
