name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write

# Publishes to public npm with the NPM_TOKEN secret.
# Set the NPM_REGISTRY_URL variable to https://npm.pkg.github.com for GitHub Packages. That uses the workflow's own token.
env:
  REGISTRY_URL: ${{ vars.NPM_REGISTRY_URL || 'https://registry.npmjs.org' }}
  NODE_AUTH_TOKEN: ${{ contains(vars.NPM_REGISTRY_URL || 'https://registry.npmjs.org', 'npm.pkg.github.com') && secrets.GITHUB_TOKEN || secrets.NPM_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Point npm at the registry
        run: |
          host="${REGISTRY_URL#*://}"
          host="${host%/}"
          echo "@point-out:registry=${REGISTRY_URL}" >> .npmrc
          echo "//${host}/:_authToken=\${NODE_AUTH_TOKEN}" >> .npmrc
      - run: pnpm build
      - name: Publish
        run: |
          flags="--access public --no-git-checks"
          # npm provenance only works against the public npm registry
          case "$REGISTRY_URL" in
            # Provenance needs repository.url in each package.json to match this repo
            *registry.npmjs.org*) flags="$flags --provenance" ;;
          esac
          pnpm -r publish $flags
